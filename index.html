<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Task Management Dashboard</title>
    <link rel="stylesheet" href="/frontend/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">&#9776;</span>
                <h1>TaskFlow</h1>
            </div>
            <nav class="header-nav">
                <span id="task-count-badge" class="badge">0 tasks</span>
            </nav>
        </div>
    </header>

    <main class="container">
        <aside class="sidebar">
            <section class="card project-section">
                <h2>Projects</h2>
                <select id="project-select" aria-label="Select project">
                    <option value="">Loading projects...</option>
                </select>
            </section>

            <section class="card add-task-section" id="add-task-form-wrapper">
                <h2>Add Task</h2>
                <form id="add-task-form">
                    <div class="form-group">
                        <label for="task-title">Title</label>
                        <input type="text" id="task-title" placeholder="e.g. Fix checkout bug" autocomplete="off">
                        <span class="error-msg" id="title-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="task-due-date">Due Date (text)</label>
                        <input type="text" id="task-due-date" placeholder="e.g. tomorrow, next friday" autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-primary">Add Task</button>
                </form>
            </section>

            <section class="card quick-add-section">
                <h2>AI Quick-Add</h2>
                <p class="quick-add-hint">Describe a task in plain English — priority and due date are parsed automatically.</p>
                <form id="quick-add-form">
                    <div class="form-group">
                        <label for="quick-add-desc">Description</label>
                        <textarea id="quick-add-desc" rows="3" placeholder="e.g. Finish the report next Friday, it's urgent"></textarea>
                        <span class="error-msg" id="quick-add-error"></span>
                    </div>
                    <button type="submit" class="btn btn-accent">Quick Add</button>
                </form>
            </section>
        </aside>

        <section class="main-content">
            <div class="content-header">
                <h2>Tasks</h2>
                <div class="sort-controls">
                    <label for="sort-select">Sort:</label>
                    <select id="sort-select">
                        <option value="">Default</option>
                        <option value="priority">Priority</option>
                        <option value="due_date">Due Date</option>
                    </select>
                </div>
            </div>

            <div class="stats-bar" id="stats-bar">
                <div class="stat-item">
                    <span class="stat-label">Total</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value" id="stat-pending">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">In Progress</span>
                    <span class="stat-value" id="stat-in-progress">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Done</span>
                    <span class="stat-value" id="stat-done">0</span>
                </div>
            </div>

            <div class="task-list-container" id="task-list">
                <div class="loading-msg" id="loading-msg">Loading tasks...</div>
            </div>

            <div class="toast" id="toast"></div>
        </section>
    </main>

    <div class="modal-overlay" id="edit-modal">
        <div class="modal">
            <h2>Edit Task</h2>
            <form id="edit-task-form">
                <input type="hidden" id="edit-task-id">
                <div class="form-group">
                    <label for="edit-title">Title</label>
                    <input type="text" id="edit-title">
                    <span class="error-msg" id="edit-title-error"></span>
                </div>
                <div class="form-group">
                    <label for="edit-priority">Priority</label>
                    <select id="edit-priority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-status">Status</label>
                    <select id="edit-status">
                        <option value="pending">Pending</option>
                        <option value="in_progress">In Progress</option>
                        <option value="done">Done</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-due-date">Due Date</label>
                    <input type="text" id="edit-due-date">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="edit-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/frontend/script.js"></script>
</body>
</html>
